trigger: none
pr: none

resources:
  pipelines:
    - pipeline: buildPipeline
      source: Merge Feature Branch to Main  # Replace with SHIVAM-DCE.Resume_ATS_Tracker if needed
      trigger:
        branches:
          - main

variables:
  resourceGroup: 'ats-resume-scanner-rg'
  appServiceName: 'ats-resume-tracker'
  azureSubscription: 'Resume-ATS-Tracker-sc'
  artifactName: 'ats-resume-tracker'
  system.debug: true

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      echo "Pipeline ID: $(resources.pipeline.buildPipeline.pipelineId)"
      echo "Run ID: $(resources.pipeline.buildPipeline.runID)"
      echo "Repository: $(Build.Repository.Name)"
      echo "Source Branch: $(Build.SourceBranch)"
    displayName: 'Debug: Log pipeline details'

  - task: DownloadPipelineArtifact@2
    displayName: 'Download build artifact'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProject)'
      pipeline: '$(resources.pipeline.buildPipeline.pipelineId)'
      runId: '$(resources.pipeline.buildPipeline.runID)'
      artifact: '$(artifactName)'
      path: '$(Build.ArtifactStagingDirectory)'
    continueOnError: true

  - script: |
      echo "Listing downloaded artifacts..."
      ls -la $(Build.ArtifactStagingDirectory)
    displayName: 'Debug: List artifacts'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webAppLinux'
      appName: '$(appServiceName)'
      package: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
      resourceGroupName: '$(resourceGroup)'