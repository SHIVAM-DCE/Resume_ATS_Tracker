# ------------------------------------
# ✅ CD pipeline: fully correct version
# ------------------------------------

trigger: none  # disables repo trigger (good!)

pr: none  # disables PR trigger (good!)

resources:
  pipelines:
    - pipeline: buildPipeline      # local alias
      source: Resume_ATS_CI        # EXACT build pipeline name in Azure DevOps
      project: $(System.TeamProject)  # optional, safer if you have multiple projects
      trigger:
        branches:
          include:
            - main   # ✅ only trigger on main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroup: 'ats-resume-scanner-rg'
  appServiceName: 'ats-resume-tracker'
  azureSubscription: 'Resume-ATS-Tracker-sc'

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download build artifact'
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProject)'
      pipeline: $(resources.pipeline.buildPipeline.pipelineID)
      runVersion: 'latest'
      artifact: 'ats-resume-tracker'
      path: '$(Build.ArtifactStagingDirectory)'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webAppLinux'
      appName: '$(appServiceName)'
      package: '$(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip'
      resourceGroupName: '$(resourceGroup)'
