trigger: none
pr: none

resources:
  pipelines:
    - pipeline: cd                    # ✅ alias for the source pipeline
      source: Resume_ATS_Tracker      # ✅ this must match the pipeline name in Azure DevOps, NOT the repo
      trigger:
        branches:
          include:
            - main

variables:
  resourceGroup: 'ats-resume-scanner-rg'   # ✅ your correct resource group
  #slotName: 'staging'                      # ✅ the slot you want to deploy to
  appServiceName: 'ats-resume-tracker'     # ✅ your actual App Service name (fixed!)
  azureSubscription: 'Resume-ATS-Tracker-sc'  # ✅ your Azure service connection name
  webAppName: 'ats-resume-tracker'          # ✅ the web app name (fixed!)
pool:
  vmImage: 'ubuntu-latest'

steps:
  # ✅ Download the build artifact from your build pipeline
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      #project: '$(System.TeamProject)'
      #pipeline: '$(resources.pipeline.cd.pipelineId)'   # ✅ uses the correct alias 'cd'
      #runVersion: 'latest'
      #artifact: 'ats-resume-tracker'
      path: '$(Build.ArtifactStagingDirectory)'

  # ✅ Deploy to the specified App Service slot
  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App Slot'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webAppLinux'
      appName: '$(appServiceName)'                   # ✅ correct app name
      package: '$(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip'
      resourceGroupName: '$(resourceGroup)'
      #deployToSlotOrASE: false                       # ✅ enable slot deploy
     # slotName: '$(slotName)'                        # ✅ slot name to deploy to
