trigger: none
pr: none

resources:
  pipelines:
    - pipeline: buildPipeline
      source: SHIVAM-DCE.Resume_ATS_Tracker  # Use the actual name of your CI pipeline
      trigger:
        branches:
          include:
            - main

variables:
  resourceGroup: 'ats-resume-scanner-rg'
  slotName: 'staging'
  appServiceName: 'ats-resume-tracker'
  azureSubscription: 'Resume-ATS-Tracker-sc'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProject)'
      pipeline: '$(resources.pipeline.buildPipeline.pipelineId)'
      runVersion: 'latest'
      artifact: 'ats-resume-tracker'
      path: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Download build artifact from CI pipeline'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webApp'
      appName: '$(appServiceName)'
      package: '$(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip'
      resourceGroupName: '$(resourceGroup)'
      deployToSlotOrASE: true
      slotName: '$(slotName)'
