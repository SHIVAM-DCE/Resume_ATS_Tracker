trigger: none
pr: none

resources:
  pipelines:
    - pipeline: cd                    # ✅ your alias for this pipeline resource
      source: SHIVAM-DCE.Resume_ATS_Tracker  # ✅ the pipeline name in Azure DevOps
      trigger:
        branches:
          include:
            - main

variables:
  resourceGroup: 'ats-resume-scanner-rg'
  slotName: 'staging'
  appServiceName: 'ats-resume-scanner'
  azureSubscription: 'Resume-ATS-Tracker-sc'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProject)'
      pipeline: '$(resources.pipeline.cd.pipelineId)'  # ✅ match alias: cd
      runVersion: 'latest'
      artifact: 'ats-resume-tracker'
      path: '$(Build.ArtifactStagingDirectory)'

  - task: AzureWebApp@1
    displayName: 'Deploy to Azure Web App'
    inputs:
      azureSubscription: '$(azureSubscription)'
      appType: 'webApp'
      appName: '$(appServiceName)'
      package: '$(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip'
      resourceGroupName: '$(resourceGroup)'
      deployToSlotOrASE: true
      slotName: '$(slotName)'