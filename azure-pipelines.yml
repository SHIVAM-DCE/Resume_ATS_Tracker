name: Merge Feature Branch to Main

trigger:
  branches:
    include:
      - main
      - feature/feature1

pool:
  vmImage: 'ubuntu-latest'

variables:
  featureBranch: 'feature/feature1'  # Define the feature branch to merge
  artifactName: 'ats-resume-tracker'  # Consistent artifact name

steps:
  # Checkout repo with push permission
  - checkout: self
    persistCredentials: true

  # Set up Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20'
    displayName: 'Set up Node.js'

  # Install dependencies
  - script: npm install
    displayName: 'Install dependencies'

  # Run placeholder tests (replace with actual tests later)
  - script: echo "Running tests..." && npm test || echo "No tests defined, skipping."
    displayName: 'Run tests'

  # Configure Git identity
  - script: |
      git config user.name "SHIVAM-DCE"
      git config user.email "shivamkumarkaimur@gmail.com"
    displayName: 'Configure Git'

  # Merge feature branch to main
  - script: |
      echo "Merging $(featureBranch) into main..."
      git fetch origin main
      git checkout main
      git pull origin main
      git merge --no-ff origin/$(featureBranch) -m "Auto merge $(featureBranch) into main"
      git push origin main
    displayName: 'Merge to main'
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'main'))

  # Delete the feature branch on remote, if it exists
  - script: |
      echo "Checking if branch $(featureBranch) exists on remote..."
      if git ls-remote --exit-code --heads origin $(featureBranch); then
        echo "Branch exists — deleting..."
        git push origin --delete refs/heads/$(featureBranch)
      else
        echo "Branch not found on remote — skipping delete."
      fi
    displayName: 'Delete feature branch'
    condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'main'))

  # Archive the repository as a build artifact (on main branch only)
  - script: |
      echo "Archiving source as artifact on main branch..."
      zip -r $(Build.ArtifactStagingDirectory)/$(artifactName).zip .
    displayName: 'Archive source as artifact'
    condition: eq(variables['Build.SourceBranchName'], 'main')

  # Verify artifact creation
  - script: |
      echo "Verifying artifact..."
      ls -la $(Build.ArtifactStagingDirectory)/$(artifactName).zip
    displayName: 'Verify artifact'
    condition: eq(variables['Build.SourceBranchName'], 'main')

  # Publish build artifact (on main branch only)
  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifact'
    condition: eq(variables['Build.SourceBranchName'], 'main')
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
      artifactName: '$(artifactName)'
      publishLocation: 'Container'