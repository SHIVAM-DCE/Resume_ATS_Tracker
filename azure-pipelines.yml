# ===============================
# ✅ CI Pipeline: Builds + Merges + Publishes Artifact
# ===============================

name: Merge Feature Branch to Main

trigger:
  branches:
    include:
      - main
      - feature/feature1

pool:
  vmImage: 'ubuntu-latest'

variables:
  FEATURE_BRANCH: feature/feature1  # Branch to merge

steps:
  # ✅ Checkout with push permission
  - checkout: self
    persistCredentials: true

  # ✅ Setup Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20'
    displayName: 'Set up Node.js'

  # ✅ Install dependencies
  - script: npm install
    displayName: 'Install dependencies'

  # ✅ Run tests (placeholder)
  - script: echo "No tests defined — skipping test step."
    displayName: 'Run tests'

  # ✅ Configure Git identity
  - script: |
      git config user.name "SHIVAM-DCE"
      git config user.email "shivamkumarkaimur@gmail.com"
    displayName: 'Configure Git'

  # ✅ Merge feature branch to main
  - script: |
      echo "Merging $(FEATURE_BRANCH) into main..."
      git fetch origin main
      git checkout main
      git pull origin main
      git merge --no-ff origin/$(FEATURE_BRANCH) -m "Auto merge $(FEATURE_BRANCH) into main"
      git push origin main
    displayName: 'Merge feature branch to main'

  # ✅ Delete feature branch if it exists
  - script: |
      echo "Checking if branch $(FEATURE_BRANCH) exists on remote..."
      if git ls-remote --exit-code --heads origin $(FEATURE_BRANCH); then
        echo "Branch exists — deleting..."
        git push origin --delete refs/heads/$(FEATURE_BRANCH)
      else
        echo "Branch not found — skipping delete."
      fi
    displayName: 'Delete feature branch on remote'

  # ✅ Archive repo as artifact (ONLY on main)
  - script: |
      if [ "$(Build.SourceBranchName)" = "main" ]; then
        echo "Archiving source..."
        zip -r $(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip .
      else
        echo "Not on main branch — skipping archive."
      fi
    displayName: 'Archive source (main only)'

  # ✅ Publish build artifact (ONLY on main)
  - task: PublishBuildArtifacts@1
    condition: eq(variables['Build.SourceBranchName'], 'main')
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/ats-resume-tracker.zip'
      ArtifactName: 'ats-resume-tracker'
      publishLocation: 'Container'
    displayName: 'Publish build artifact (main only)'
